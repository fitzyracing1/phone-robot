<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>phone-robot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>phone-robot</h1>
  <form id="keyform" hidden>
    <input id="key" type="password" placeholder="view key" autocomplete="off" aria-label="view key">
    <button>Show</button>
  </form>
  <label>Device <select id="device"></select></label>
  <label>Window <select id="minutes">
    <option value="15">15 min</option><option value="60" selected>1 h</option><option value="360">6 h</option><option value="1440">24 h</option>
  </select></label>
  <button id="forget" type="button" hidden>Forget key</button>
  <span id="status" class="badge" hidden></span>
</header>
<main>
  <div id="map" aria-label="map of recent points"></div>
  <aside>
    <div id="latest"><p class="muted">Enter the view key to load data.</p></div>
    <section id="motion" hidden>
      <h2>Motion <span id="motion-span" class="muted small"></span></h2>
      <div class="chart"><div class="chart-label">accel rms <b id="accel-now"></b></div><svg id="accel-chart" viewBox="0 0 300 48" preserveAspectRatio="none" role="img" aria-label="accelerometer rms over the window"></svg></div>
      <div class="chart"><div class="chart-label">gyro rms <b id="gyro-now"></b></div><svg id="gyro-chart" viewBox="0 0 300 48" preserveAspectRatio="none" role="img" aria-label="gyroscope rms over the window"></svg></div>
      <div class="chart"><div class="chart-label">speed <b id="speed-now"></b></div><svg id="speed-chart" viewBox="0 0 300 48" preserveAspectRatio="none" role="img" aria-label="speed over the window"></svg></div>
      <div class="chart"><div class="chart-label">activity</div><svg id="activity-strip" viewBox="0 0 300 10" preserveAspectRatio="none" role="img" aria-label="activity over the window"></svg></div>
      <p id="activity-legend" class="legend small"></p>
    </section>
    <section id="control" hidden>
      <h2>Control</h2>
      <div class="row">
        <button type="button" data-cmd="start">Start</button>
        <button type="button" data-cmd="stop">Stop</button>
        <button type="button" data-cmd="ping">Ping</button>
      </div>
      <form id="taskform">
        <input id="goal" maxlength="500" placeholder="Ask: where is the phone?" aria-label="task goal" autocomplete="off">
        <button>Run</button>
      </form>
      <p id="features" class="muted small"></p>
      <pre id="transcript" hidden></pre>
      <h3>Commands</h3>
      <ul id="commands" class="list"></ul>
      <h3>Audit <button type="button" id="verify" class="small">verify chain</button></h3>
      <ul id="audit" class="list"></ul>
    </section>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/app.js"></script>
</body>
</html>
